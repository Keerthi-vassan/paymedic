services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - RAZORPAY_EXECUTION_ENABLED=${RAZORPAY_EXECUTION_ENABLED:-false}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_REAL_TXN_COUNT=${RAZORPAY_REAL_TXN_COUNT:-4}
      # Empty by default: /webhooks/razorpay refuses every delivery rather
      # than accepting unverified ones (see app/routers/webhooks.py).
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - NOTIFICATION_LLM_ENABLED=${NOTIFICATION_LLM_ENABLED:-true}
      - DATABASE_URL=sqlite:////app/data/recovery.db
      - FRONTEND_ORIGIN=http://localhost:3000

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
